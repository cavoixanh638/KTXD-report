/* PH1 Document Studio application chrome and WYSIWYG page */
:root{--studio-navy:#193753;--studio-blue:#245d90;--studio-paper:#fff;--studio-bg:#ecf0f3;--studio-line:#d6dfe6}
body{background:var(--studio-bg)}
.layout{display:block!important;min-height:100vh}
.sidebar{display:none!important}
.app-main{max-width:none!important;margin:0!important;padding:0!important;min-width:0}
.studio-top{position:sticky;z-index:30;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px;min-height:59px;background:#fff;border-bottom:1px solid var(--studio-line);font:13px/1.35 "Segoe UI",Arial,sans-serif}
.studio-top .brand{color:var(--studio-navy);font-size:16px;font-weight:700;white-space:nowrap}
.studio-top .brand small{display:inline-block;margin-left:7px;color:#47835f;font-size:10px;font-weight:650;border:1px solid #bad9c6;padding:3px 6px;border-radius:5px}
.studio-top .brand em{font-size:10px;display:block;color:#65778a;font-weight:400;font-style:normal}
.studio-top .top-group{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
.studio-top button,.studio-tools button,.studio-rail button,.studio-right button,.studio-top select,.studio-tools select{font:inherit;border:1px solid #cbd7e0;border-radius:6px;padding:7px 10px;background:#fff;color:var(--studio-navy);cursor:pointer}
.studio-top button:hover,.studio-tools button:hover,.studio-rail button:hover{background:#eaf2f9}
.studio-top .primary,.studio-tools .primary{background:var(--studio-blue);color:white;border-color:var(--studio-blue)}
.studio-top .autosave-state{font-size:12px;color:#557080;white-space:nowrap}
.studio-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 59px)}
.studio-rail{background:#fff;border-right:1px solid var(--studio-line);padding:15px 8px;align-self:stretch}
.studio-rail nav{position:sticky;top:78px;display:grid;gap:5px}
.studio-rail button{width:100%;text-align:left;border:0;padding:11px 10px;display:flex;align-items:center;gap:10px;color:#364e60}
.studio-rail button.selected{background:#e5eff8;color:#174977;font-weight:700}
.studio-rail .rail-icon{font-size:16px;min-width:20px;text-align:center}
.studio-main{min-width:0}
.studio-tools{position:sticky;top:59px;z-index:25;background:#f9fbfc;border-bottom:1px solid var(--studio-line);padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.studio-tools .description{color:#647587;font-size:11px;margin-left:auto}
.studio-tools label{font:12px/1.2 "Segoe UI",Arial,sans-serif;color:#41576b;display:inline-flex;flex-direction:row;align-items:center;gap:5px;margin:0}
.studio-body{display:grid;grid-template-columns:minmax(215px,245px) minmax(0,1fr);gap:0;min-height:calc(100vh - 120px)}
.studio-left{background:#fff;border-right:1px solid var(--studio-line);padding:13px;min-width:0;max-height:calc(100vh - 120px);overflow-y:auto;position:sticky;top:121px}
.studio-left .panel,.studio-right .panel{padding:12px;border:0;box-shadow:none;margin:0}
.studio-left .selectors .section-head{align-items:start;gap:4px;flex-wrap:wrap}
.studio-left h2{font-size:14px}
.studio-left .locality-list{max-height:calc(100vh - 340px);min-height:160px;overflow:auto}
.studio-left .locality-item{font-size:12px}
.studio-left .actions.compact button{font-size:11px}
.studio-right{min-width:0;padding:20px 18px 35px;overflow:auto}
.studio-note{font:12px/1.45 "Segoe UI",Arial,sans-serif;color:#4b6578;margin-bottom:12px}
.studio-pages{display:flex;flex-direction:column;align-items:center;gap:24px;min-width:0;transform-origin:top center}
.paper-sheet{background:var(--studio-paper);width:var(--paper-w);height:var(--paper-h);box-shadow:0 2px 14px #1f3e5828;box-sizing:border-box;position:relative;flex:none;color:#111;overflow:hidden}
.paper-content{font:var(--doc-font)/1.28 "Times New Roman",Times,serif;padding:9mm 10mm;display:flex;flex-direction:column;height:100%;box-sizing:border-box}
.doc-head{display:flex;justify-content:space-between;text-align:center;gap:18px;min-height:24mm;font-size:.85em}
.doc-authority{width:36%;font-weight:700}
.doc-national{width:58%;display:flex;flex-direction:column;gap:3px}
.doc-national span{font-weight:600}
.doc-heading{text-align:center;margin:2mm auto 2mm;max-width:94%}
.doc-edit-title,.doc-edit{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer;text-align:inherit;padding:0}
.doc-edit-title{font-size:1.05em;font-weight:bold;line-height:1.2}
.doc-edit:hover,.doc-edit-title:hover{text-decoration:underline;text-decoration-style:dotted}
.doc-heading p{font-size:.85em;font-style:italic;margin:3px}
.doc-caption{font-size:.75em;color:#555;text-align:center;margin-bottom:3mm}
.doc-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.76em;overflow-wrap:anywhere}
.doc-table td,.doc-table th{border:1px solid #555;padding:3px 4px;vertical-align:middle}
.doc-table thead th{background:#f1f1f1;font-weight:bold;text-align:center}
.doc-table tbody th{font-weight:normal;text-align:left}
.doc-table td.number{text-align:right}
.doc-table .doc-index{width:8mm;text-align:center}
.doc-table .doc-label{width:26%;text-align:left}
.doc-table.vertical .doc-label{width:16%}
.doc-cell{font:inherit;background:transparent;border:0;color:inherit;cursor:pointer;text-align:right;padding:0;overflow-wrap:anywhere}
.doc-cell:hover{text-decoration:underline}
.doc-cell.partial::after{content:"*";vertical-align:super;font-size:8px}
.doc-cell.unavailable{color:#555;font-style:italic}
.doc-notes{font-size:.68em;line-height:1.3;margin-top:auto;padding-top:3mm;color:#333}
.doc-notes p{margin:1mm 0}
.doc-page-number{text-align:center;font-size:.8em;padding-top:2mm}
.doc-appendix{font-size:.78em;line-height:1.45;overflow-wrap:anywhere}
.no-selection{text-align:center;padding:25mm 5mm;color:#596a79;font-size:1.1em}
.studio-control-sheet{background:#fff;border:1px solid var(--studio-line);border-radius:10px;margin:18px;padding:20px}
.studio-control-sheet h1{font-size:22px;color:var(--studio-navy)}
.studio-control-sheet .page-header{margin:0 0 16px}
.studio-zoom{transform-origin:top center}
.studio-input-panel{background:#fff;border-radius:10px;padding:20px}
.studio-dropzone{border:2px dashed #a9bdce;border-radius:10px;padding:28px;text-align:center;background:#f7fafc;cursor:pointer}
.studio-dropzone.dragover{background:#e4f0fa;border-color:#28658e}
.source-review{margin-top:16px;display:grid;gap:12px}
.source-review .source-item{border:1px solid #d9e3eb;padding:14px;border-radius:8px;background:#fff}
.source-review .source-item label{display:inline-flex;flex-direction:column;margin:5px 12px 5px 0;gap:4px}
.source-review .source-item input{padding:8px;border-radius:5px;border:1px solid #bfcfdb}
.studio-setting-panel{max-width:950px;margin:20px auto}
.studio-setting-panel .editor-grid{display:block}
.studio-setting-panel .panel{margin:0}
.studio-foot-status{position:fixed;right:10px;bottom:10px;z-index:20;background:#fff;padding:7px 12px;box-shadow:0 2px 7px #0002;font:11px "Segoe UI",Arial,sans-serif}
.studio-view-hint{font:12px "Segoe UI",Arial,sans-serif;color:#60798c;text-align:center;margin:10px}
.studio-session-select{max-width:200px;min-width:100px}
.studio-top .backup-note{color:#a25a28;font-size:11px;white-space:nowrap}
.studio-rail-compact .studio-wrap{grid-template-columns:57px minmax(0,1fr)}
.studio-rail-compact .studio-rail .rail-label{display:none}
.studio-rail-compact .studio-rail button{justify-content:center}
.studio-rail-compact .studio-rail{padding:15px 3px}
.studio-rail-compact .studio-rail button .rail-icon{min-width:22px}
.studio-wide .studio-body{grid-template-columns:minmax(0,1fr)}
.studio-wide .studio-left{display:none}
.studio-wide .studio-right{padding:14px}
@media(max-width:1100px){.studio-top{flex-wrap:wrap}.studio-wrap{grid-template-columns:58px minmax(0,1fr)}.studio-rail .rail-label{display:none}.studio-body{grid-template-columns:190px minmax(0,1fr)}.studio-left{position:static}.studio-rail button{justify-content:center}}
@media(max-width:700px){.studio-wrap{grid-template-columns:1fr}.studio-rail{display:none}.studio-body{grid-template-columns:1fr}.studio-left{position:static;max-height:300px}.studio-top .top-group{gap:3px}.studio-right{padding:10px}.studio-tools{top:0}.paper-sheet{max-width:none}}
@media(prefers-reduced-motion:no-preference){.studio-top button,.studio-tools button,.studio-rail button{transition:background-color 160ms ease,border-color 160ms ease}}
@page{size:A4 landscape;margin:0}
@media print{

function configPanel(s){const st=s.settings;return `<section class="panel"><div class="section-head"><h2>Tùy chỉnh báo cáo</h2><span>Lưu độc lập theo từng phiên</span></div><label>Tiêu đề<input data-setting="title" value="${attribute(st.title)}"/></label><div class="field-grid"><label>Đơn vị tiền<select data-setting="moneyUnit"><option value="billion" ${st.moneyUnit==='billion'?'selected':''}>Tỷ đồng</option><option value="million" ${st.moneyUnit==='million'?'selected':''}>Triệu đồng</option></select></label><label>Diện tích<select data-setting="areaUnit"><option value="m2" ${st.areaUnit==='m2'?'selected':''}>m²</option><option value="ha" ${st.areaUnit==='ha'?'selected':''}>ha</option></select></label><label>Số chữ số thập phân<input data-setting="decimals" type="number" min="0" max="6" value="${st.decimals}"/></label><label>Cỡ chữ<input data-setting="fontSize" type="number" min="10" max="19" value="${st.fontSize}"/></label><label>Độ rộng cột (px)<input data-setting="columnWidth" type="number" min="115" max="350" value="${st.columnWidth}"/></label><label>Ngưỡng nhận xét (điểm %)<input data-setting="threshold" type="number" min="0" max="100" step="0.05" value="${st.threshold}"/></label><label>Khổ giấy<select data-setting="paperSize"><option ${st.paperSize==='A4'?'selected':''}>A4</option><option ${st.paperSize==='A3'?'selected':''}>A3</option></select></label><label>Hướng in<select data-setting="orientation"><option value="landscape" ${st.orientation==='landscape'?'selected':''}>landscape</option><option value="portrait" ${st.orientation==='portrait'?'selected':''}>portrait</option></select></label><label>Màu tiêu đề<input data-setting="headingColor" type="color" value="${attribute(st.headingColor)}"/></label><label>Từ cao hơn<input data-setting="words.higher" value="${attribute(st.words.higher)}"/></label><label>Từ thấp hơn<input data-setting="words.lower" value="${attribute(st.words.lower)}"/></label></div><h3>14 chỉ tiêu theo mẫu (đổi tên, sắp xếp, ẩn/hiện)</h3><div class="row-options">${s.rows.map((r,i)=>`<div class="row-option"><input type="checkbox" data-toggle-row="${attribute(r.key)}" ${r.visible?'checked':''}/><input aria-label="Nhãn chỉ tiêu" data-row-label="${attribute(r.key)}" value="${attribute(r.label)}"/><button data-action="move-row" data-index="${i}" data-dir="-1" title="Đưa lên">↑</button><button data-action="move-row" data-index="${i}" data-dir="1" title="Đưa xuống">↓</button><button data-action="duplicate-row" data-index="${i}" title="Nhân bản chỉ tiêu cùng công thức">+</button></div>`).join('')}</div></section>`;}
function benchmarkCards(s){const r=['REV','DISB','GPMB'].map(type=>{
 const ds=K.bound(work,s,type),b=K.benchmark(ds,type);if(!ds)return `<div class="metric"><span>${type}</span><strong>Chưa nhập</strong><small>Không có dữ liệu được tự tạo</small></div>`;
 return `<div class="metric"><span>${type} · ${ds.localities.length}/114 có bản ghi</span><strong>${b.value?K.format(b.value.toString(),'percent',s.settings):'Chưa có tỷ lệ'}</strong><small>${esc(ds.asOfDate)} · tổng/tổng${b.quality==='PARTIAL_AGGREGATE'?' · PARTIAL':''}${ds.localities.length<114?' · mốc tham khảo, chưa đủ 114':''}</small></div>`;});return `<div class="metrics">${r.join('')}</div>`;}
function reportPage(){const s=active();if(!s)return `<div class="page-header"><h1>Bảng kết quả</h1></div><section class="panel empty">Chưa có phiên báo cáo. <button data-action="new">+ Tạo báo cáo</button></section>`;
 report=K.buildReport(work,s);const {columns,rows}=report;
 const tr=rows.map((x,ri)=>`<tr><th class="sticky stt">${x.row.originalRow}</th><th class="sticky labelcol">${esc(x.row.label)}</th>${x.cells.map((o,ci)=>`<td><button class="result-cell ${o.quality==='PARTIAL_AGGREGATE'?'partial':''} ${o.state==='OUT_OF_SCOPE'?'missing':''}" data-action="inspect" data-row="${ri}" data-col="${ci}" aria-label="Xem phép tính ${esc(x.row.label)} ${esc(columns[ci].name)}">${esc(o.trace.result.displayedText)}<span class="trace-icon">↗</span></button></td>`).join('')}</tr>`).join('');
 const missing=report.coverage,issues=report.issues;
 return `<div class="page-header"><div><div class="eyebrow">Báo cáo theo mẫu · ${s.selected.length} địa phương</div><h1>${esc(s.name)}</h1><p>Các ô hiển thị đều mở được hồ sơ phép tính; nguồn và ngày được giữ độc lập.</p></div><div class="actions"><button data-action="print">In / lưu PDF</button><button class="primary" data-action="xlsx">Xuất Excel có truy vết</button></div></div>${benchmarkCards(s)}<div class="editor-grid"><div>${selectedControls(s)}${configPanel(s)}</div><div><section class="panel report-panel" id="print-area"><div class="print-title"><h2>${esc(s.settings.title)}</h2><p>${esc(s.name)} · ${s.selected.length} địa phương · ${new Date().toLocaleDateString('vi-VN')}</p></div><div class="table-wrap results"><table class="report-grid" style="--cw:${s.settings.columnWidth}px;--fs:${s.settings.fontSize}px;--heading:${attribute(s.settings.headingColor)}"><thead><tr><th class="sticky stt">STT</th><th class="sticky labelcol">CHỈ TIÊU</th>${columns.map(c=>`<th class="citycol">${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${tr||'<tr><td colspan="3" class="empty">Chưa chọn địa phương. Danh mục không chọn sẵn xã nào.</td></tr>'}</tbody></table></div><div class="footnotes"><p><b>Phương pháp:</b> tỷ lệ tổng hợp = SUM(tử số)/SUM(mẫu số), không lấy trung bình tỷ lệ các địa phương. GPMB chỉ tính diện tích I đã ghi nhận trên D các dự án, đánh dấu PARTIAL nếu thiếu I.</p><p><b>Nguồn & thời điểm:</b> ${report.sources.map(d=>`${esc(d.type)} ${esc(d.asOfDate)} (${d.localities.length} địa phương)`).join('; ')||'Chưa nhập nguồn'}. Mốc REV 113 và GPMB 108 là tham khảo, chưa đủ 114.</p><h3>Địa phương/ô chưa có dữ liệu trong phạm vi phiên</h3>${missing.length?`<ul>${missing.map(x=>`<li>${esc(x.name)} · ${esc(x.type)} · ${esc(x.status)} · ${esc(x.sourceCell)} — ${esc(x.reason)}</li>`).join('')}</ul>`:'<p>Không có cảnh báo thiếu bản ghi trong phạm vi địa phương đang chọn.</p>'}<h3>Kiểm tra chất lượng liên quan địa phương đang chọn</h3>${issues.length?`<ul>${issues.map(x=>`<li>${esc(x.locality)} · ${esc(x.rule)} · dòng ${x.row}, ${esc(x.sourceCell)}${x.delta?' · chênh '+esc(K.format(x.delta,'',{decimals:2}))+' điểm %':''}</li>`).join('')}</ul>`:'<p>Không có cảnh báo liên quan phạm vi đang chọn.</p>'}</div></section></div></div>`;}
function inspector(ri,ci){const o=report?.rows[ri]?.cells[ci];if(!o)return;inspected=o;
 const t=o.trace,loc=report.columns[ci],data=[];
 data.push(['Chỉ tiêu',report.rows[ri].row.label],['Địa phương',loc.name],['Giá trị',t.result.displayedText],['Trạng thái',t.quality.status],['Công thức',t.formula.readableExpression],['Số gốc',t.result.exactDecimal??'Không có'],['Đơn vị',t.result.canonicalUnit],['ID phép tính',t.traceId],['Ngày chốt',t.scope.asOfDates.join('; ')],['Số bản ghi tham gia',t.population.includedCount],['Số bản ghi bỏ qua',t.population.excludedCount],['Số thiếu thành phần',t.population.missingCount]);
 const list=(arr,render)=>arr.length?`<details><summary>${arr.length} phần tử — mở danh sách</summary><div class="detail-list">${arr.map(render).join('')}</div></details>`:'<p>Không có.</p>';
 const ds=K.bound(work,active(),K.METRIC_SOURCE[report.rows[ri].row.metric]),rec=ds?.records.find(r=>r.localityId===loc.id&&r.fields.Q?.raw);
 const q=ds?.type==='DISB'&&rec?.fields.Q?.raw;
 $('#inspector').innerHTML=`<div class="inspector-head"><div class="eyebrow">Hồ sơ phép tính · PH1.1</div><h2>${esc(report.rows[ri].row.label)}</h2><button data-action="close-inspect" class="close" aria-label="Đóng">×</button></div><div class="inspect-scroll"><div class="inspector-summary">${data.map(([k,v])=>`<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div><h3>Các bước tính (không làm tròn số gốc)</h3>${list(t.steps,x=>`<div><b>${esc(x.operation)}</b>: ${esc(x.inputs.join(' · '))} → <b>${esc(x.output??'Không xác định')}</b><small>${esc(x.reason)}</small></div>`)}<h3>Toán hạng</h3>${list(t.operands,x=>`<div>${esc(x.role)} (${esc(x.unit)}) = ${esc(x.exactValue??x.state)} <small>${esc(x.sources.map(s=>s.sheetName+'!'+s.address).join('; '))}</small></div>`)}<h3>Bản ghi được tính</h3>${list(t.population.includedRecordIds,x=>`<div>${esc(x)}</div>`)}<h3>Không tính/thiếu và lý do</h3>${list(t.exclusions,x=>`<div><b>${esc(x.recordId)}</b>: ${esc(x.reasonCode)} · ${esc(x.affectedOperand)} · ${esc(x.sourceCell||'')}<small>${esc(x.explanation)}</small></div>`)}<h3>Đóng góp mẫu số 0 hợp lệ</h3>${list(t.zeroDenominatorContributors||[],x=>`<div>${esc(x.recordId)}: tử ${esc(x.numeratorExactDecimal)} / mẫu 0, vẫn tính tử số vào tổng</div>`)}<h3>Ô nguồn, SHA và ngày chốt</h3>${list(t.sourceRefs,x=>`<div>${esc(x.fileName)} · ${esc(x.sheetName)}!${esc(x.address)}<small>SHA ${esc(x.fileSha256)} · ${esc(x.asOfDate)}${x.sourceFormula?' · formula: '+esc(x.sourceFormula):''}</small></div>`)}${q?`<h3>Ghi chú Q (nguyên văn, chưa được xác minh để điều chỉnh)</h3><pre class="raw-note">${esc(q)}</pre>`:''}<div class="actions"><button data-action="copy-trace">Sao chép JSON truy vết</button><button data-action="close-inspect">Đóng</button></div></div>`;$('#inspector').hidden=false;$('#overlay').hidden=false;}
function render(){header();$('#main').innerHTML=tab==='sessions'?sessionsPage():tab==='sources'?sourcePage():reportPage();$('#inspector').hidden=true;$('#overlay').hidden=true;updateBadge();}
function applyFilter(){const s=K.plain($('#locality-search')?.value||''),kind=$('#locality-type')?.value||'';document.querySelectorAll('.locality-item').forEach(x=>x.hidden=!(x.dataset.search.includes(s)&&(!kind||x.dataset.type===kind)));}
function fieldChanged(e){const t=e.target,s=active();if(t.id==='source-type'){let d={DISB:'2026-10-15',REV:'',GPMB:'2026-10-26'}[t.value];$('#source-date').value=d;$('#source-reason').value='';return;}if(t.id==='locality-search'||t.id==='locality-type'){applyFilter();return;}
 if(t.dataset.loc&&s){const k=t.dataset.loc;if(t.checked&&!s.selected.includes(k))s.selected.push(k);else if(!t.checked)s.selected=s.selected.filter(x=>x!==k);mutate(s,'Chọn địa phương');return;}
 if(t.dataset.setting&&s){const k=t.dataset.setting,setting=s.settings;if(k.startsWith('words.'))setting.words[k.split('.')[1]]=t.value;else if(['decimals','fontSize','columnWidth','threshold'].includes(k)){let n=Number(t.value);if(!Number.isFinite(n))return;setting[k]=n;}else setting[k]=t.value;mutate(s,'Đổi tùy chỉnh '+k);return;}
 if(t.dataset.rowLabel&&s){let r=s.rows.find(x=>x.key===t.dataset.rowLabel);if(r&&t.value.trim()){r.label=t.value;mutate(s,'Đổi nhãn chỉ tiêu');}return;}
 if(t.dataset.toggleRow&&s){let r=s.rows.find(x=>x.key===t.dataset.toggleRow);if(r){r.visible=t.checked;mutate(s,'Ẩn/hiện chỉ tiêu');}return;}
 if(t.id==='restore-file'){restore(t.files?.[0]);}
}
async function restore(file){if(!file)return;try{if(file.size>35*1024*1024)throw Error('Bản sao lưu vượt 35MB');let restored=await K.verifiedBackup(JSON.parse(await file.text()));
 let replace=confirm('Bản sao lưu hợp lệ. OK: thay thế workspace hiện tại. Cancel: hợp nhất với workspace hiện tại (giữ phiên hiện có).');
 if(replace){work=restored;}else{for(const d of restored.datasets)if(!work.datasets.some(x=>x.id===d.id))work.datasets.push(d);for(const ss of restored.sessions){let clone=JSON.parse(JSON.stringify(ss));if(work.sessions.some(x=>x.id===clone.id)){clone.id=K.id();clone.name+=' (khôi phục)';}work.sessions.push(clone);}work.audit.push({when:new Date().toISOString(),action:'Hợp nhất từ bản sao lưu hợp lệ'});}
 work.lastBackupAt=null;persist();nav('sessions');status('Đã kiểm checksum và khôi phục '+restored.sessions.length+' phiên.');}catch(e){status('Không thể khôi phục: '+e.message,true);}}
async function importSource(){const file=$('#source-file')?.files?.[0],type=$('#source-type')?.value,date=$('#source-date')?.value,reason=$('#source-reason')?.value;if(!file)return status('Chưa chọn tệp XLSX',true);
 let btn=$('#import-btn');btn.disabled=true;btn.textContent='Đang đọc nguồn và kiểm tra...';try{
 const ds=await K.importFile(file,type,date,reason);
 if(work.datasets.some(x=>x.id===ds.id))throw Error('Dataset trùng SHA đã nhập; không tạo bản sao');
 work.datasets.push(ds);for(const ss of work.sessions)if(!ss.bindings[type]){ss.bindings[type]=ds.id;K.updateSession(ss,'Gắn nguồn đầu tiên '+type);}
 work.audit.push({when:new Date().toISOString(),action:'Nhập '+type,hash:ds.hash,date:ds.asOfDate});persist();render();status('Nhập thành công '+type+': '+ds.localities.length+' địa phương, '+ds.issues.length+' cờ chất lượng; SHA '+ds.hash.slice(0,16));
 }catch(e){status('Không thể nhập: '+e.message,true);btn.disabled=false;btn.textContent='Kiểm tra và nhập nguồn';}
}
async function writeBackup(single=false){try{const s=active();if(single&&!s)throw Error('Chưa chọn phiên');let data=single?{...work,sessions:[JSON.parse(JSON.stringify(s))],active:s.id,datasets:work.datasets.filter(d=>Object.values(s.bindings).includes(d.id))}:work;
 const backup=await K.signedBackup(data),blob=new Blob([JSON.stringify(backup)],{type:'application/json'});download(blob,`KTXH_${single?'phien':'workspace'}_${new Date().toISOString().slice(0,10)}.kxh.json`);work.lastBackupAt=new Date().toISOString();persist();backupDirty=false;updateBadge();status('Đã tạo tệp sao lưu có SHA-256. Hãy giữ tệp tại nơi an toàn.');}catch(e){status('Sao lưu lỗi: '+e.message,true);}}
async function actionClick(e){const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action,s=active();
 try{switch(a){
 case 'nav':nav(t.dataset.target);break;
 case 'new':{const ss=K.newSession(work,'Báo cáo '+(work.sessions.length+1));work.sessions.push(ss);work.active=ss.id;persist();nav('report');break;}
 case 'open-session':work.active=t.dataset.id;persist();nav('report');break;
 case 'rename-session':{const ss=work.sessions.find(x=>x.id===t.dataset.id),n=prompt('Tên phiên mới:',ss.name);if(n?.trim()){ss.name=n.trim();mutate(ss,'Đổi tên phiên');}break;}
 case 'copy-session':{const orig=work.sessions.find(x=>x.id===t.dataset.id),copy=JSON.parse(JSON.stringify(orig));copy.id=K.id();copy.name+=' (bản sao)';copy.createdAt=new Date().toISOString();copy.updatedAt=copy.createdAt;copy.revision=1;copy.audit=[];work.sessions.push(copy);work.active=copy.id;persist();nav('report');break;}
 case 'delete-session':{const ss=work.sessions.find(x=>x.id===t.dataset.id);if(confirm('Xóa phiên '+ss.name+'? Thao tác không thể khôi phục nếu chưa sao lưu.')){work.sessions=work.sessions.filter(x=>x.id!==ss.id);if(work.active===ss.id)work.active=work.sessions[0]?.id||null;persist();render();}break;}
 case 'select-visible':{if(!s)return;const vis=[...document.querySelectorAll('.locality-item')].filter(x=>!x.hidden).map(x=>x.querySelector('input').dataset.loc);for(const id of vis)if(!s.selected.includes(id))s.selected.push(id);mutate(s,'Chọn danh sách lọc');break;}
 case 'clear-localities':{if(s&&confirm('Bỏ chọn tất cả địa phương của phiên này?')){s.selected=[];mutate(s,'Bỏ chọn toàn bộ địa phương');}break;}
 case 'move-row':{if(!s)return;const i=Number(t.dataset.index),j=i+Number(t.dataset.dir);if(j>=0&&j<s.rows.length){[s.rows[i],s.rows[j]]=[s.rows[j],s.rows[i]];mutate(s,'Đổi thứ tự chỉ tiêu');}break;}
 case 'duplicate-row':{if(!s)return;const i=Number(t.dataset.index),row=s.rows[i],copy={...row,key:row.key+'-copy-'+K.id().slice(-7),label:row.label+' (bản sao)'};s.rows.splice(i+1,0,copy);mutate(s,'Nhân bản chỉ tiêu có công thức chuẩn');break;}
 case 'inspect':inspector(Number(t.dataset.row),Number(t.dataset.col));break;
 case 'close-inspect':$('#inspector').hidden=true;$('#overlay').hidden=true;break;
 case 'copy-trace':if(inspected){await navigator.clipboard.writeText(JSON.stringify(inspected.trace,null,2));status('Đã sao chép hồ sơ truy vết.');}break;
 case 'import':await importSource();break;
 case 'backup':await writeBackup(false);break;
 case 'backup-session':await writeBackup(true);break;
 case 'print':if(s){document.documentElement.style.setProperty('--paper-size',s.settings.paperSize);document.documentElement.style.setProperty('--paper-orientation',s.settings.orientation);root.print();}break;
 case 'xlsx':if(s){let b=await K.exportXlsx(work,s,report||K.buildReport(work,s));download(b,'KTXH_'+new Date().toISOString().slice(0,10)+'.xlsx');status('Đã xuất XLSX với số numeric, công thức, trace, nguồn thiếu và cảnh báo.');}break;

// Only evidence stated in the selected visible sheet's A1 may prefill a day.
// A file name, period label, another sheet or the current date are not a day source.
function dateFromTitle(text){
 const found=new Set();
 for(const match of String(text||'').matchAll(/(?:^|[^\d])([0-3]?\d)[./-]([01]?\d)[./-]((?:19|20)\d{2})(?!\d)/g)){
  const day=Number(match[1]),month=Number(match[2]),year=Number(match[3]);
  const d=new Date(Date.UTC(year,month-1,day));
  if(d.getUTCFullYear()===year&&d.getUTCMonth()===month-1&&d.getUTCDate()===day){
   found.add(String(year).padStart(4,'0')+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0'));
  }
 }
 return found.size===1?[...found][0]:null;
}
function dateOnlyReason(text){return /^\s*\d{1,4}\s*[./-]\s*\d{1,2}\s*[./-]\s*\d{1,4}\s*$/.test(text||'');}
async function identifyFiles(files){
 pending=[];navigate('sources');
 for(const file of files){
  const entry={file,type:null,error:null,date:'',reason:'',dateAutomatic:false,dateEvidence:'',validationError:'',alreadyPresent:false,sheet:'',count:0,projects:0};
  try{
   if(!/\.xlsx$/i.test(file.name))throw Error('Chỉ hỗ trợ .xlsx');
   const bytes=await file.arrayBuffer(),book=await K.openBook(bytes),matches=[];
   for(const [type,profile] of Object.entries(K.kinds)){
    for(const sh of book.sheets.filter(x=>x.state==='visible'&&x.name===profile.sheet)){
     const rows=await K.sheetRows(book,sh);
     const first=type==='GPMB'?rows.get(3)?.B?.text:rows.get(profile.rows[0])?.B?.text;
     if(!/^(xã|phường|đặc khu)\s+/iu.test(K.normName(first)))continue;
     if(type==='DISB'&&!K.isDecimal(rows.get(13)?.F?.text))continue;
     if(type==='REV'&&!K.isDecimal(rows.get(11)?.C?.text))continue;
     matches.push({type,sheet:sh.name,rows});
    }
   }
   if(matches.length!==1)throw Error(matches.length?'Nhiều cấu trúc có thể khớp, cần xác minh thủ công':'Không nhận diện được profile nguồn; chưa nhập');
   const match=matches[0];entry.type=match.type;entry.sheet=match.sheet;
   entry.count={DISB:114,REV:113,GPMB:108}[entry.type];entry.projects=entry.type==='GPMB'?422:0;
   if(pending.some(x=>x.type===entry.type&&!x.error))throw Error('Có hai tệp cùng loại '+entry.type+'; chỉ được chọn một cho lượt nhập');
   const hash=await K.sha256(bytes);
   entry.alreadyPresent=work.datasets.some(ds=>ds.type===entry.type&&ds.hash===hash);
   if(!entry.alreadyPresent){
    const title=K.normName(match.rows.get(1)?.A?.text||'');
    const fromTitle=dateFromTitle(title);
    entry.dateEvidence=title?match.sheet+'!A1: '+title:'Không có ngày chốt rõ trong ô A1';
    // Only fixed profiles DISB/GPMB use their title's explicit, unique date.
    // REV "10 tháng" does not establish an as-of date, even if another date occurs.
    if(entry.type!=='REV'&&fromTitle&&fromTitle===K.kinds[entry.type].date){
     entry.date=fromTitle;
     entry.reason='Xác nhận theo '+entry.dateEvidence;
     entry.dateAutomatic=true;
    }
   }
  }catch(e){entry.error=e.message;}
  pending.push(entry);render();
 }
}
async function commitPending(){
 // Preserve edits before any asynchronous work, even when another file is invalid.
 const successful=new Set(),inserts=[],failures=[];
 for(const [i,item] of pending.entries()){
  if(item.error||item.alreadyPresent){if(item.alreadyPresent)successful.add(item);continue;}
  item.date=$('[data-pending-date="'+i+'"]')?.value||item.date||'';
  item.reason=$('[data-pending-reason="'+i+'"]')?.value?.trim()||'';
  item.validationError='';
  if(!item.date){
   item.validationError='Chưa có ngày chốt. Cần xác minh rồi nhập ngày, không tự lấy từ tên file.';
  }else if(!item.reason){
   item.validationError='Cần căn cứ xác nhận ngày chốt. Với nguồn thu, ghi rõ văn bản hoặc người xác nhận.';
  }else if(dateOnlyReason(item.reason)){
   item.validationError='Căn cứ phải là lời giải thích hoặc nguồn xác nhận, không chỉ là một ngày.';
  }
  if(item.validationError){failures.push(item.file.name);continue;}
  try{
   const ds=await K.importFile(item.file,item.type,item.date,item.reason);
   if(!work.datasets.some(x=>x.id===ds.id)&&!inserts.some(x=>x.id===ds.id))inserts.push(ds);
   successful.add(item);
  }catch(e){item.validationError=e.message;failures.push(item.file.name);}
 }
 for(const ds of inserts){
  work.datasets.push(ds);
  for(const s of work.sessions)if(!s.bindings[ds.type])s.bindings[ds.type]=ds.id;
  work.audit.push({action:'Nhập '+ds.type,hash:ds.hash,when:new Date().toISOString()});
 }
 pending=pending.filter(item=>!successful.has(item));
 if(inserts.length)mark();
 render();
 if(failures.length&&inserts.length){
  alertMessage('Đã nhập '+inserts.length+' nguồn hợp lệ; còn '+failures.length+' tệp cần xác minh ngày/căn cứ. Các nguồn đã nhập không bị mất.',true);
 }else if(failures.length){
  alertMessage('Chưa thể nhập '+failures.length+' tệp. Xem lỗi ngay dưới từng nguồn; dữ liệu đã nhập trước đó vẫn giữ nguyên.',true);
 }else{
  alertMessage('Đã nhập '+inserts.length+' nguồn mới. Các nguồn có cùng SHA-256 đã được bỏ qua.');
 }
}

async function restore(file){

 if(replace)work=restored;
 else{
  for(const ds of restored.datasets)if(!work.datasets.some(x=>x.id===ds.id))work.datasets.push(ds);
  for(const s of restored.sessions){const v=JSON.parse(JSON.stringify(s));if(work.sessions.some(x=>x.id===v.id)){v.id=K.id();v.name+=' (khôi phục)';}work.sessions.push(v);}
 }

}

 if(el.id==='locality-type'){filterLoc();return}
 if(el.id==='studio-zoom'){zoom=el.value;render();return}
 if(el.id==='studio-mode'&&s){s.settings.tableMode=el.value;changed(s,'Đổi chiều bảng');return}
 if(el.dataset.loc&&s){const id=el.dataset.loc;if(el.checked&&!s.selected.includes(id))s.selected.push(id);else if(!el.checked)s.selected=s.selected.filter(x=>x!==id);changed(s,'Chọn địa phương');return}
 if(el.dataset.setting&&s){
  const k=el.dataset.setting;if(['decimals','fontSize','threshold','areaDecimals','columnWidth'].includes(k)){const n=Number(el.value);if(!Number.isFinite(n))return;s.settings[k]=n;}else s.settings[k]=el.value;
  changed(s,'Chỉnh định dạng '+k);return;
 }
 if(el.dataset.rowLabel&&s){const r=s.rows.find(x=>x.key===el.dataset.rowLabel);if(r&&el.value.trim()){r.label=el.value.trim();changed(s,'Đổi nhãn');}return}
 if(el.dataset.toggleRow&&s){const r=s.rows.find(x=>x.key===el.dataset.toggleRow);if(r){r.visible=el.checked;changed(s,'Ẩn hiện chỉ tiêu');}}
}
async function start(){
 try{work=await S.read()||S.fallbackRead()||K.emptyWorkspace();if(!Array.isArray(work.sessions)||!Array.isArray(work.datasets))work=K.emptyWorkspace();}
 catch{work=S.fallbackRead()||K.emptyWorkspace();}
 const host=$('#main');if(!host)return;
 const header=document.createElement('div');header.id='studio-header';document.body.prepend(header);
 const rail=document.createElement('aside');rail.id='studio-rail';rail.className='studio-rail';
 const wrap=document.createElement('div');wrap.className='studio-wrap';const main=document.createElement('div');main.className='studio-main';
 host.parentNode.insertBefore(wrap,host);main.append(host);wrap.append(rail,main);
 host.className='app-main';
 document.addEventListener('click',actions);
 document.addEventListener('change',fieldChanged);
 document.addEventListener('input',e=>{if(e.target.id==='locality-search')filterLoc();});
 document.addEventListener('dragover',e=>{if(e.target.closest('#studio-dropzone')){e.preventDefault();e.target.closest('#studio-dropzone').classList.add('dragover');}});
 document.addEventListener('dragleave',e=>{e.target.closest('#studio-dropzone')?.classList.remove('dragover')});
 document.addEventListener('drop',e=>{const dz=e.target.closest('#studio-dropzone');if(dz){e.preventDefault();dz.classList.remove('dragover');identifyFiles(e.dataTransfer.files);}});
 $('#overlay').addEventListener('click',()=>{$('#inspector').hidden=true;$('#overlay').hidden=true});
 root.addEventListener('beforeunload',e=>{if(saveTimer||saveError||backupDirty){e.preventDefault();e.returnValue='';}});
 render();
}
document.addEventListener('DOMContentLoaded',start);
})(typeof globalThis!=='undefined'?globalThis:this);
</script></body></html>
